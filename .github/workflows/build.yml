name: Twitter Z² AutoBuild (6 Variants)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # Daily at 6 AM UTC

env:
  APP_NAME: twitter

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: experimental
            apk_version: latest
            patch_channel: prerelease
          - variant: stable
            apk_version: recommended
            patch_channel: stable
          - variant: xnav
            apk_version: "12.2.1"
            patch_channel: prerelease
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Install Android Build Tools
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p $HOME/Android/Sdk/cmdline-tools/latest
          mv cmdline-tools/* $HOME/Android/Sdk/cmdline-tools/latest/
          export PATH=$PATH:$HOME/Android/Sdk/cmdline-tools/latest/bin
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "build-tools;34.0.0" > /dev/null 2>&1
          echo "$HOME/Android/Sdk/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Download ReVanced CLI
        run: |
          mkdir -p tools
          curl -sL "https://github.com/revanced/revanced-cli/releases/latest/download/revanced-cli-all.jar" -o tools/revanced-cli.jar

      - name: Download Twitter APK
        env:
          APK_VARIANT: ${{ matrix.apk_version }}
          OUTPUT_APK: base-twitter.apk
        run: python scripts/download_apk.py

      - name: Get APK Version
        id: version
        run: |
          if [ "${{ matrix.apk_version }}" = "latest" ]; then
            VERSION=$(aapt dump badging base-twitter.apk | grep "versionName" | cut -d"'" -f2)
          elif [ "${{ matrix.apk_version }}" = "recommended" ]; then
            VERSION=$(aapt dump badging base-twitter.apk | grep "versionName" | cut -d"'" -f2)
          else
            VERSION="${{ matrix.apk_version }}"
          fi
          echo "apk_version=$VERSION" >> $GITHUB_OUTPUT
          echo "📱 Detected APK version: $VERSION"

      - name: Download Piko Patches
        run: |
          PATCH_URL="https://revanced-external-bundles.brosssh.com/api/v2/bundle/crimera/piko/latest?channel=${{ matrix.patch_channel }}"
          echo "📦 Downloading patches from: $PATCH_URL"
          curl -sL "$PATCH_URL" -o patches.json

      - name: Patch Twitter (Normal Version)
        run: |
          echo "🔧 Patching Twitter (${{ matrix.variant }}) - Normal version..."
          java -jar tools/revanced-cli.jar patch \
            base-twitter.apk \
            -b patches.json \
            -o Twitter-Piko-${{ steps.version.outputs.apk_version }}-arm64-v8a.apk \
            --exclude="bring-back-twitter" \
            --exclude="dynamic-color"

      - name: Patch Twitter (Clone Version)
        run: |
          echo "🔧 Patching Twitter (${{ matrix.variant }}) - Clone version..."
          java -jar tools/revanced-cli.jar patch \
            base-twitter.apk \
            -b patches.json \
            -o twitter-patched-clone.apk \
            --exclude="bring-back-twitter" \
            --exclude="dynamic-color"

      - name: Clone and Strip Permissions
        env:
          PATCHED_APK_PATH: twitter-patched-clone.apk
          TRACK: ${{ matrix.variant }}
          APK_VERSION: ${{ steps.version.outputs.apk_version }}
        run: python scripts/clone_and_strip.py

      - name: Upload Both Versions to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Twitter-Piko-${{ steps.version.outputs.apk_version }}-arm64-v8a.apk
            Twitter-Z2-Piko-${{ steps.version.outputs.apk_version }}-arm64-v8a.apk
          tag_name: ${{ matrix.variant }}-latest
          name: "Twitter Piko - ${{ matrix.variant }}"
          body: |
            ## Twitter Piko ${{ matrix.variant }} Builds
            
            **Build Details:**
            - APK Version: ${{ steps.version.outputs.apk_version }}
            - Patch Channel: ${{ matrix.patch_channel }}
            - Architecture: arm64-v8a only
            
            **Files:**
            1. `Twitter-Piko-${{ steps.version.outputs.apk_version }}-arm64-v8a.apk` - Normal patched version
            2. `Twitter-Z2-Piko-${{ steps.version.outputs.apk_version }}-arm64-v8a.apk` - Z² Clone (com.twitter.androie)
            
            **Excluded Patches:**
            - bring-back-twitter
            - dynamic-color
            
            **Z² Clone Features:**
            - Package: com.twitter.androie
            - App Name: Z²
            - Permissions: Stripped to 5 essential only
            
            ---
            *Auto-built on ${{ github.run_id }}*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
