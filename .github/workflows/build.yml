name: Twitter Z² AutoBuild

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

env:
  APP_NAME: twitter
  JAVA_TOOL_OPTIONS: "-Xmx8g"

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: xnav-stable
            app_token: XNAV
            piko_token: StablePiko
            storage_tag: Twitter-stock-apk
            storage_pattern: "*12.2.1*"
            storage_optional: "false"
            expect_prefix: "12.2.1"
            xshim: "true"
            patch_source: piko-stable
            extra_perms: ""
          - variant: xnav-dev
            app_token: XNAV
            piko_token: DevPiko
            storage_tag: Twitter-stock-apk
            storage_pattern: "*12.2.1*"
            storage_optional: "false"
            expect_prefix: "12.2.1"
            xshim: "true"
            patch_source: piko-dev
            extra_perms: ""
          - variant: classic-stable
            app_token: Classic
            piko_token: StablePiko
            storage_tag: Twitter-stock-apk
            storage_pattern: "*12.19.1*"
            storage_optional: "false"
            expect_prefix: "12.19.1"
            xshim: "false"
            patch_source: piko-stable
            extra_perms: ""
          - variant: classic-dev
            app_token: Classic
            piko_token: DevPiko
            storage_tag: Twitter-stock-apk
            storage_pattern: "*12.19.1*"
            storage_optional: "false"
            expect_prefix: "12.19.1"
            xshim: "false"
            patch_source: piko-dev
            extra_perms: ""
          - variant: newx
            app_token: NewX
            piko_token: NewX
            storage_tag: Twitter-stock-apk
            storage_pattern: "*12.25.0*"
            storage_optional: "true"
            expect_prefix: ""
            xshim: "false"
            patch_source: newx
            extra_perms: "android.permission.CHANGE_NETWORK_STATE"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Write Cloning Script
        run: |
          mkdir -p scripts
          cat << 'PYEOF' > scripts/clone_and_strip.py
          import xml.etree.ElementTree as ET
          import os
          import subprocess
          import sys
          import zipfile
          import glob
          import hashlib
          import zlib
          import struct

          NEW_PACKAGE_NAME = "com.twitter.androie"
          OLD_PACKAGE = "com.twitter.android"
          NEW_APP_NAME = "Z²"
          ANDROID = "{http://schemas.android.com/apk/res/android}"
          BASE_PERMISSIONS = ["android.permission.FOREGROUND_SERVICE", "android.permission.FOREGROUND_SERVICE_DATA_SYNC", "android.permission.INTERNET", "android.permission.ACCESS_NETWORK_STATE", "android.permission.ACCESS_WIFI_STATE"]
          EXTRA = [p.strip() for p in os.environ.get("EXTRA_PERMISSIONS", "").split(",") if p.strip()]
          ALLOWED_PERMISSIONS = BASE_PERMISSIONS + EXTRA

          def main():
              print("Allowed permissions for this build: " + ", ".join(ALLOWED_PERMISSIONS))
              mode = os.environ.get("MODE", "clone")
              apk_file = os.environ.get("PATCHED_APK_PATH", "patched-base.apk")
              if not os.path.exists(apk_file):
                  print("Patched APK not found")
                  sys.exit(1)

              decode_target = apk_file
              tmp_apk = apk_file + ".dexpatched"

              if mode == "clone":
                  print("Rewriting package strings inside DEX (URV Style)...")
                  with zipfile.ZipFile(apk_file, "r") as zin, zipfile.ZipFile(tmp_apk, "w", zipfile.ZIP_DEFLATED) as zout:
                      for item in zin.infolist():
                          if item.filename.startswith("META-INF"):
                              continue
                          data = zin.read(item.filename)
                          if item.filename.endswith(".dex"):
                              patched = data.replace(b"com.twitter.android", b"com.twitter.androie")
                              if patched != data:
                                  sha1_sig = hashlib.sha1(patched[32:]).digest()
                                  temp_data = patched[:12] + sha1_sig + patched[32:]
                                  adler32_sum = zlib.adler32(temp_data[12:]) & 0xFFFFFFFF
                                  patched = temp_data[:8] + struct.pack('<I', adler32_sum) + temp_data[12:]
                                  print("  patched strings and fixed DEX header in " + item.filename)
                              data = patched
                          zout.writestr(item, data)
                  decode_target = tmp_apk
                  print("DEX string rewrite complete")

              decoded_dir = "twitter_decoded"
              print("Decoding APK in " + mode + " mode...")
              subprocess.run(["apktool", "d", decode_target, "-o", decoded_dir, "-f", "--no-src"], check=True)

              if mode == "clone":
                  print("Rewriting package-scope attributes in decoded resources...")
                  ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
                  RES_ATTRS = ["authorities", "authority", "contentAuthority", "accountType", "targetPackage"]
                  res_count = 0
                  for xml_file in glob.glob(os.path.join(decoded_dir, "res", "**", "*.xml"), recursive=True):
                      try:
                          res_tree = ET.parse(xml_file)
                      except ET.ParseError:
                          continue
                      res_root = res_tree.getroot()
                      changed = False
                      for el in res_root.iter():
                          for key in list(el.attrib.keys()):
                              local = key.split("}")[-1] if "}" in key else key
                              if local in RES_ATTRS:
                                  val = el.get(key)
                                  if val and OLD_PACKAGE in val:
                                      el.set(key, val.replace(OLD_PACKAGE, NEW_PACKAGE_NAME))
                                      changed = True
                                      res_count += 1
                      if changed:
                          res_tree.write(xml_file, encoding="utf-8", xml_declaration=True)
                  print("Rewrote " + str(res_count) + " resource attribute values (accountType/authority/targetPackage)")

              manifest_path = os.path.join(decoded_dir, "AndroidManifest.xml")
              tree = ET.parse(manifest_path)
              root = tree.getroot()

              app = root.find("application")
              if app is not None:
                  app.set(ANDROID + "extractNativeLibs", "true")

              if mode == "clone":
                  print("Converting relative class names to absolute...")
                  converted = 0
                  for element in root.iter():
                      name_attr = element.get(ANDROID + "name")
                      if name_attr and name_attr.startswith("."):
                          element.set(ANDROID + "name", OLD_PACKAGE + name_attr)
                          converted += 1
                  print("Converted " + str(converted) + " relative class names to absolute")

                  root.set("package", NEW_PACKAGE_NAME)
                  if app is not None:
                      app.set(ANDROID + "label", NEW_APP_NAME)

                  SAFE_ATTRS = ["authorities", "taskAffinity", "targetPackage"]
                  renamed_attrs = 0
                  for element in root.iter():
                      for key in list(element.attrib.keys()):
                          local = key.split("}")[-1] if "}" in key else key
                          if local in SAFE_ATTRS:
                              val = element.get(key)
                              if val and OLD_PACKAGE in val:
                                  element.set(key, val.replace(OLD_PACKAGE, NEW_PACKAGE_NAME))
                                  renamed_attrs += 1
                  print("Renamed " + str(renamed_attrs) + " package-scope attributes (no sharedUserId)")

              removed = 0
              for perm_type in ["uses-permission", "uses-permission-sdk-23"]:
                  for perm in list(root.findall(perm_type)):
                      perm_name = perm.get(ANDROID + "name")
                      if not perm_name:
                          continue
                      if perm_name in ALLOWED_PERMISSIONS:
                          continue
                      root.remove(perm)
                      removed += 1
              print("Removed " + str(removed) + " requested permissions (APKTool M style)")

              bad = []
              for perm in list(root.findall("uses-permission")) + list(root.findall("uses-permission-sdk-23")):
                  name = perm.get(ANDROID + "name")
                  if name and name not in ALLOWED_PERMISSIONS:
                      bad.append(name)
              if bad:
                  print("MANIFEST VERIFICATION FAILED:")
                  for b in bad:
                      print("   " + b)
                  sys.exit(1)
              print("Manifest verification passed")

              tree.write(manifest_path, encoding="utf-8", xml_declaration=True)

              if mode == "clone":
                  strings_path = os.path.join(decoded_dir, "res", "values", "strings.xml")
                  if os.path.exists(strings_path):
                      str_tree = ET.parse(strings_path)
                      str_root = str_tree.getroot()
                      for string in str_root.findall("string"):
                          if string.get("name") in ["app_name", "title", "name"]:
                              string.text = NEW_APP_NAME
                      str_tree.write(strings_path, encoding="utf-8", xml_declaration=True)

              processed_apk = "twitter-processed.apk"
              print("Rebuilding APK...")
              subprocess.run(["apktool", "b", decoded_dir, "-o", processed_apk, "--use-aapt2"], check=True)

              ultra_apk = "twitter-ultra.apk"
              print("Applying UltraZip compression (Level 9, resources.arsc stored)...")
              with zipfile.ZipFile(processed_apk, 'r') as zin, zipfile.ZipFile(ultra_apk, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as zout:
                  for item in zin.infolist():
                      data = zin.read(item.filename)
                      if item.filename == "resources.arsc":
                          zout.writestr(item, data, compress_type=zipfile.ZIP_STORED)
                      else:
                          zout.writestr(item, data, compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

              aligned_apk = "twitter-aligned.apk"
              print("Zipaligning APK (page-aligned natives)...")
              subprocess.run(["zipalign", "-f", "-p", "4", ultra_apk, aligned_apk], check=True)

              app_token = os.environ.get("APP_TOKEN", "Unknown")
              piko_token = os.environ.get("PIKO_TOKEN", "Unknown")
              apk_version = os.environ.get("APK_VERSION", "unknown")
              patch_version = os.environ.get("PATCH_VERSION", "unknown")
              prefix = ("Twitter-Z2-Piko-" if mode == "clone" else "Twitter-Piko-") + app_token + "-" + piko_token + "-"
              final_apk = prefix + "v" + apk_version + "-" + patch_version + "-arm64-v8a.apk"

              keystore = "debug.keystore"
              if not os.path.exists(keystore):
                  subprocess.run(["keytool", "-genkey", "-v", "-keystore", keystore, "-alias", "z2debug", "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000", "-storepass", "android", "-keypass", "android", "-dname", "CN=Z2"], check=True)

              print("Signing APK...")
              subprocess.run(["apksigner", "sign", "--ks", keystore, "--ks-pass", "pass:android", "--out", final_apk, aligned_apk], check=True)

              result = subprocess.run(["aapt", "dump", "permissions", final_apk], capture_output=True, text=True)
              bad_final = []
              for line in result.stdout.splitlines():
                  line = line.strip()
                  if line.startswith("uses-permission:") and "name='" in line:
                      name = line.split("name='")[1].split("'")[0]
                      if name not in ALLOWED_PERMISSIONS:
                          bad_final.append(name)
              if bad_final:
                  print("FINAL APK VERIFICATION FAILED:")
                  for b in bad_final:
                      print("   " + b)
                  sys.exit(1)
              print("Final APK permissions verified clean:")
              print(result.stdout)

              print("SUCCESS: " + final_apk)
              cleanup = [decoded_dir, processed_apk, ultra_apk, aligned_apk]
              if mode == "clone":
                  cleanup.append(tmp_apk)
              subprocess.run(["rm", "-rf"] + cleanup)

          if __name__ == "__main__":
              main()
          PYEOF
          python -c "import ast; ast.parse(open('scripts/clone_and_strip.py').read()); print('Script syntax OK')"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install System Dependencies
        run: |
          pip install requests beautifulsoup4
          sudo apt-get update
          sudo apt-get install -y jq
          APKTOOL_VERSION="2.11.1"
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" -o /usr/local/bin/apktool.jar
          curl -sL "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool" -o /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool

      - name: Install Android Build Tools
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p $HOME/Android/Sdk/cmdline-tools/latest
          mv cmdline-tools/* $HOME/Android/Sdk/cmdline-tools/latest/
          export PATH=$PATH:$HOME/Android/Sdk/cmdline-tools/latest/bin
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "build-tools;34.0.0" > /dev/null 2>&1
          echo "$HOME/Android/Sdk/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Download Morphe CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p tools
          RELEASE_INFO=$(curl -sL -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/MorpheApp/morphe-cli/releases/latest")
          JAR_URL=$(echo "$RELEASE_INFO" | grep -o '"browser_download_url": "[^"]*-all.jar"' | head -n 1 | cut -d'"' -f4)
          curl -sL "$JAR_URL" -o tools/morphe-cli.jar

      - name: Download APKEditor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p tools
          RELEASE_INFO=$(curl -sL -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/REAndroid/APKEditor/releases/latest")
          JAR_URL=$(echo "$RELEASE_INFO" | grep -o '"browser_download_url": "[^"]*\.jar"' | head -n 1 | cut -d'"' -f4)
          curl -sL "$JAR_URL" -o tools/APKEditor.jar

      - name: Install apkeep
        run: |
          wget -q https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x apkeep-x86_64-unknown-linux-gnu
          sudo mv apkeep-x86_64-unknown-linux-gnu /usr/local/bin/apkeep

      - name: Download Twitter APK & Merge Splits
        id: apk_version_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p download_dir
          if [ -n "${{ matrix.storage_tag }}" ]; then
            if gh release download "${{ matrix.storage_tag }}" --pattern "${{ matrix.storage_pattern }}.apkm" --pattern "${{ matrix.storage_pattern }}.xapk" --pattern "${{ matrix.storage_pattern }}.apk" --dir download_dir; then
              echo "✅ Using storage bundle: ${{ matrix.storage_tag }} (pattern: ${{ matrix.storage_pattern }})"
            else
              if [ "${{ matrix.storage_optional }}" = "true" ]; then
                echo "⚠️ Storage tag '${{ matrix.storage_tag }}' missing pattern '${{ matrix.storage_pattern }}' — falling back to stores..."
              else
                echo "❌ Storage release '${{ matrix.storage_tag }}' missing or missing pattern '${{ matrix.storage_pattern }}'."
                exit 1
              fi
            fi
          fi
          if ! find download_dir -type f \( -name "*.apk" -o -name "*.xapk" -o -name "*.apkm" \) | grep -q .; then
            echo "Trying APKPure (up to 3 attempts)..."
            for i in 1 2 3; do
              if apkeep -a com.twitter.android -d apk-pure download_dir; then break; fi
              echo "apkeep attempt $i failed, retrying..."
              sleep 5
            done
            if ! find download_dir -type f \( -name "*.apk" -o -name "*.xapk" -o -name "*.apkm" \) | grep -q .; then
              echo "APKPure failed. Falling back to Huawei AppGallery..."
              apkeep -a com.twitter.android -d huawei-app-gallery download_dir || true
            fi
          fi
          DOWNLOADED_FILE=$(find download_dir -type f \( -name "*.apk" -o -name "*.xapk" -o -name "*.apkm" \) | head -n 1)
          if [ -z "$DOWNLOADED_FILE" ]; then
            echo "❌ No APK could be downloaded from any source."
            ls -la download_dir
            exit 1
          fi
          if [[ "$DOWNLOADED_FILE" == *.xapk ]] || [[ "$DOWNLOADED_FILE" == *.apkm ]]; then
            mkdir -p xapk_extracted merge_dir
            unzip -q "$DOWNLOADED_FILE" -d xapk_extracted

            echo "Merging minimal splits (URV Style): base + arm64 + en + xhdpi + nodpi/anydpi..."
            find xapk_extracted -maxdepth 2 -name "*.apk" ! -name "*config.*" ! -name "*split*" -exec cp {} merge_dir/ \;
            find xapk_extracted -maxdepth 2 -name "*.apk" \( -name "*arm64_v8a*" -o -name "*arm64-v8a*" \) -exec cp {} merge_dir/ \;
            find xapk_extracted -maxdepth 2 -name "*.apk" \( -name "*.en.apk" -o -name "*config.en.apk" \) -exec cp {} merge_dir/ \;
            find xapk_extracted -maxdepth 2 -name "*.apk" \( -name "*.xhdpi.apk" -o -name "*.nodpi.apk" -o -name "*.anydpi.apk" \) -exec cp {} merge_dir/ \;

            echo "Selected splits:"
            ls -lh merge_dir

            java -jar tools/APKEditor.jar m -i merge_dir -o base-twitter-merged.apk
            mv base-twitter-merged.apk base-twitter.apk
          else
            mv "$DOWNLOADED_FILE" base-twitter.apk
          fi
          VERSION=$(aapt dump badging base-twitter.apk | grep "versionName" | head -n 1 | sed -E "s/.*versionName='([^']+)'.*/\1/")
          echo "Base APK version: $VERSION"

          if [ -n "${{ matrix.expect_prefix }}" ]; then
            case "$VERSION" in
              "${{ matrix.expect_prefix }}"*) ;;
              *)
                echo "❌ Version guard failed: expected prefix '${{ matrix.expect_prefix }}' but base APK reports $VERSION"
                echo "   Check the contents of storage release '${{ matrix.storage_tag }}'."
                exit 1
                ;;
            esac
          fi

          if [ "${{ matrix.patch_source }}" = "newx" ]; then
            if [[ "$VERSION" != *"-prod"* ]]; then
              echo "❌ NewX requires a -prod build, but got $VERSION"
              exit 1
            fi
          else
            if [[ "$VERSION" != *"-release"* ]]; then
              echo "❌ Piko (Stable/Dev) requires a -release build, but got $VERSION"
              exit 1
            fi
          fi
          echo "✅ Base APK version verified: $VERSION"
          echo "apk_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download Patch Bundle
        id: patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.patch_source }}" = "newx" ]; then
            MANIFEST_URL="https://raw.githubusercontent.com/crimera/piko-newx/main/patches-bundle.json"
          elif [ "${{ matrix.patch_source }}" = "piko-dev" ]; then
            MANIFEST_URL="https://raw.githubusercontent.com/crimera/piko/dev/patches-bundle.json"
          else
            MANIFEST_URL="https://raw.githubusercontent.com/crimera/piko/main/patches-bundle.json"
          fi

          echo "Fetching bundle manifest from $MANIFEST_URL"
          curl -fsSL "$MANIFEST_URL" -o bundle.json || {
            echo "❌ Failed to download bundle manifest"
            exit 1
          }

          MPP_URL=$(jq -r '.. | strings | select(endswith(".mpp"))' bundle.json | head -n 1)
          if [ -z "$MPP_URL" ] || [ "$MPP_URL" = "null" ]; then
            echo "❌ Could not find .mpp download URL in bundle.json"
            cat bundle.json
            exit 1
          fi

          echo "Downloading compiled .mpp from $MPP_URL"
          curl -fsSL "$MPP_URL" -o patches.mpp || {
            echo "❌ Failed to download .mpp file"
            exit 1
          }

          PATCH_TAG=$(jq -r '.[0].version // .version // empty' bundle.json | head -n 1)
          if [ -z "$PATCH_TAG" ]; then
            PATCH_TAG=$(echo "$MPP_URL" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+[^/]*' | head -n 1 | sed 's/^v//')
            if [ -z "$PATCH_TAG" ]; then PATCH_TAG="unknown"; fi
          fi

          echo "patch_version=$PATCH_TAG" >> $GITHUB_OUTPUT

      - name: Download Nai Privacy Bundle
        run: |
          echo "Fetching Nai's Extra Patches manifest..."
          curl -fsSL "https://raw.githubusercontent.com/Nai64/Nai64ExtraPatches/refs/heads/main/patches-bundle.json" -o nai-bundle.json || {
            echo "❌ Failed to download Nai bundle manifest"
            exit 1
          }
          NAI_URL=$(jq -r '.. | strings | select(endswith(".mpp"))' nai-bundle.json | head -n 1)
          if [ -z "$NAI_URL" ] || [ "$NAI_URL" = "null" ]; then
            echo "❌ Could not find .mpp download URL in nai-bundle.json"
            cat nai-bundle.json
            exit 1
          fi
          echo "Downloading Nai .mpp from $NAI_URL"
          curl -fsSL "$NAI_URL" -o nai.mpp || {
            echo "❌ Failed to download Nai .mpp file"
            exit 1
          }

      - name: Write Nai Options File
        run: |
          cat << 'JSONEOF' > nai-options.json
          [
            { "patchName": "Spoof SIM Country", "options": [ { "key": "spoofSimCountryIso", "value": "nl" } ] },
            { "patchName": "Spoof SIM Operator", "options": [ { "key": "spoofSimOperatorMccMnc", "value": "20408" } ] },
            { "patchName": "Spoof SIM Operator Name", "options": [ { "key": "spoofSimOperatorName", "value": "KPN" } ] },
            { "patchName": "Spoof SIM Serial Number", "options": [ { "key": "simSerial", "value": "8931084206518391742" } ] },
            { "patchName": "Spoof Subscriber ID", "options": [ { "key": "subscriberId", "value": "204081234567890" } ] },
            { "patchName": "Spoof Phone Number", "options": [ { "key": "phoneNumber", "value": "" } ] },
            { "patchName": "Spoof Time Zone", "options": [ { "key": "timeZoneId", "value": "Europe/Amsterdam" } ] },
            { "patchName": "Spoof Locale", "options": [ { "key": "spoofLocaleTag", "value": "en-US" } ] }
          ]
          JSONEOF
          python -c "import json; json.load(open('nai-options.json')); print('Nai options JSON OK')"

      - name: Apply x-shim PairIP Bypass (XNAV Only)
        if: matrix.xshim == 'true'
        run: |
          set -o pipefail
          echo "Fetching x-shim bundle manifest from GitLab..."
          curl -fsSL "https://gitlab.com/inotia00/x-shim/-/raw/main/patches-bundle.json?ref_type=heads" -o x-shim-bundle.json

          MPP_URL=$(jq -r '.. | strings | select(endswith(".mpp"))' x-shim-bundle.json | head -n 1)
          if [ -z "$MPP_URL" ] || [ "$MPP_URL" = "null" ]; then
            echo "❌ Could not find x-shim .mpp URL in GitLab manifest"
            exit 1
          fi

          echo "Downloading x-shim .mpp from $MPP_URL"
          curl -fsSL "$MPP_URL" -o x-shim.mpp

          echo "Applying x-shim..."
          java -jar tools/morphe-cli.jar patch -p x-shim.mpp -f --continue-on-error -o base-twitter-xshim.apk base-twitter.apk | tee xshim_log.txt
          mv base-twitter-xshim.apk base-twitter.apk

      - name: Patch Twitter Base (Piko + Nai, ONCE)
        run: |
          set -o pipefail
          echo "--- Starting patch run ---"
          java -jar tools/morphe-cli.jar patch \
            -p patches.mpp \
            -p nai.mpp \
            --options-file nai-options.json \
            -e "Disable Root Checks" \
            -e "Empty Clipboard Report" \
            -e "Hide Clipboard" \
            -e "Hide Clipboard Description" \
            -e "Spoof SIM Country" \
            -e "Spoof SIM Operator" \
            -e "Spoof SIM Operator Name" \
            -e "Spoof SIM Serial Number" \
            -e "Limit Ad Tracking" \
            -e "Spoof Tracking IDs" \
            -e "Disable Telemetry" \
            -e "Disable Crash Reporters" \
            -e "Remove Ad Services Entries" \
            -e "Strip Exif Location" \
            -e "Spoof Last Known Location" \
            -e "Spoof Play Store Install Source" \
            -e "Spoof Subscriber ID" \
            -e "Spoof Phone Number" \
            -e "Spoof Voice Mail" \
            -e "Hide Roaming Status" \
            -e "Spoof Time Zone" \
            -e "Spoof Locale" \
            -e "Disable Firebase Auto-Init" \
            -e "Disable Firebase Performance" \
            -e "Disable Remote Config Fetch" \
            -e "Bypass VPN Detection" \
            -f --continue-on-error \
            -d "Bring back twitter" -d "Dynamic color" \
            -o patched-base.apk base-twitter.apk | tee patch_out.txt

      - name: Normal — Strip, UltraZip, Sign
        env:
          PATCHED_APK_PATH: patched-base.apk
          MODE: strip
          APP_TOKEN: ${{ matrix.app_token }}
          PIKO_TOKEN: ${{ matrix.piko_token }}
          APK_VERSION: ${{ steps.apk_version_step.outputs.apk_version }}
          PATCH_VERSION: ${{ steps.patches.outputs.patch_version }}
          EXTRA_PERMISSIONS: ${{ matrix.extra_perms }}
        run: |
          set -o pipefail
          python -u scripts/clone_and_strip.py | tee strip_normal_log.txt

      - name: Clone — Rewrite, Strip, UltraZip, Sign
        env:
          PATCHED_APK_PATH: patched-base.apk
          MODE: clone
          APP_TOKEN: ${{ matrix.app_token }}
          PIKO_TOKEN: ${{ matrix.piko_token }}
          APK_VERSION: ${{ steps.apk_version_step.outputs.apk_version }}
          PATCH_VERSION: ${{ steps.patches.outputs.patch_version }}
          EXTRA_PERMISSIONS: ${{ matrix.extra_perms }}
        run: |
          set -o pipefail
          python -u scripts/clone_and_strip.py | tee clone_log.txt

      - name: Build Release Notes
        run: |
          APPV="${{ steps.apk_version_step.outputs.apk_version }}"
          PATV="${{ steps.patches.outputs.patch_version }}"
          PSRC="${{ matrix.patch_source }}"
          NF="Twitter-Piko-${{ matrix.app_token }}-${{ matrix.piko_token }}-v$APPV-$PATV-arm64-v8a.apk"
          CF="Twitter-Z2-Piko-${{ matrix.app_token }}-${{ matrix.piko_token }}-v$APPV-$PATV-arm64-v8a.apk"
          {
            echo "### ${{ matrix.app_token }} + ${{ matrix.piko_token }} (bundle: $PSRC + Nai privacy profile)"
            echo ""
            echo "- **App version:** v$APPV | **Patch bundle:** $PATV | **Arch:** arm64-v8a | **Density:** xhdpi/nodpi"
            echo ""
            if [ -f xshim_log.txt ]; then
              echo "🛡️ **x-shim PairIP bypass applied first:**"
              grep "INFO: Applied:" xshim_log.txt | sed 's/.*INFO: Applied: */- /' || true
              echo ""
            fi
            echo "#### $NF"
            echo ""
            echo "- **SHA256:** $(sha256sum "$NF" | cut -d' ' -f1)"
            echo "- **Size:** $(du -h "$NF" | cut -f1)"
            echo ""
            echo "<details><summary>Verified permissions of this exact file (aapt dump)</summary>"
            echo ""
            echo '```'
            aapt dump permissions "$NF"
            echo '```'
            echo "</details>"
            echo ""
            echo "**Applied patches:**"
            grep "INFO: Applied:" patch_out.txt | sed 's/.*INFO: Applied: */- /' || true
            echo ""
            echo "**Not applied (incompatible or failed):**"
            grep -h "WARNING: Skipping\|SEVERE: FAILED:" patch_out.txt | sed 's/.*WARNING: Skipping: */- /; s/.*SEVERE: FAILED: */- /' || true
            echo ""
            echo "#### $CF"
            echo ""
            echo "- **SHA256:** $(sha256sum "$CF" | cut -d' ' -f1)"
            echo "- **Size:** $(du -h "$CF" | cut -f1)"
            echo ""
            echo "<details><summary>Verified permissions of this exact file (aapt dump)</summary>"
            echo ""
            echo '```'
            aapt dump permissions "$CF"
            echo '```'
            echo "</details>"
            echo ""
            echo "All of the above, plus URV clone modifications:"
            grep -h "Rewrote \|Converted \|Renamed " clone_log.txt | sed 's/^/- /' || true
            echo "- Package renamed to com.twitter.androie (label Z², no sharedUserId)"
          } > release_notes.md

      - name: Compose Cumulative Release Body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          {
            echo "## Run ${{ github.run_number }} — $RUN_DATE"
            echo ""
            cat release_notes.md
          } > new_section.md
          OLD_BODY=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ matrix.variant }}-builds" | jq -r '.body // empty')
          {
            cat new_section.md
            echo ""
            if [ -n "$OLD_BODY" ]; then printf '%s\n' "$OLD_BODY"; fi
          } > combined.md
          awk -v max=10 '/^## Run / { n++ } n <= max { print }' combined.md > final_body.md

      - name: Upload APKs + Release Notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.variant }}-builds
          name: "Twitter Piko — ${{ matrix.app_token }} + ${{ matrix.piko_token }}"
          body_path: final_body.md
          files: |
            Twitter-Piko-${{ matrix.app_token }}-${{ matrix.piko_token }}-v${{ steps.apk_version_step.outputs.apk_version }}-${{ steps.patches.outputs.patch_version }}-arm64-v8a.apk
            Twitter-Z2-Piko-${{ matrix.app_token }}-${{ matrix.piko_token }}-v${{ steps.apk_version_step.outputs.apk_version }}-${{ steps.patches.outputs.patch_version }}-arm64-v8a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}