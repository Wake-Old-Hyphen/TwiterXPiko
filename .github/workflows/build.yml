name: Twitter Z² AutoBuild (6 Variants)

on:
  workflow_dispatch: # Allows manual triggering
  schedule:
    - cron: '0 6 * * *' # Runs daily at 6 AM UTC

env:
  APP_NAME: twitter

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    permissions:           # FIX 1: Grants permission to create releases
      contents: write      
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: experimental
            apk_version: latest
            patch_channel: prerelease
          - variant: stable
            apk_version: recommended
            patch_channel: stable
          - variant: xnav
            apk_version: "12.2.1"
            patch_channel: prerelease
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install System Dependencies
        run: |
          pip install requests beautifulsoup4
          sudo apt-get update
          sudo apt-get install -y jq
          echo "📥 Downloading latest apktool..."
          APKTOOL_VERSION="2.11.1"
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" -o /usr/local/bin/apktool.jar
          curl -sL "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool" -o /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool

      - name: Install Android Build Tools
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p $HOME/Android/Sdk/cmdline-tools/latest
          mv cmdline-tools/* $HOME/Android/Sdk/cmdline-tools/latest/
          export PATH=$PATH:$HOME/Android/Sdk/cmdline-tools/latest/bin
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "build-tools;34.0.0" > /dev/null 2>&1
          echo "$HOME/Android/Sdk/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Download Morphe CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📥 Downloading Morphe CLI..."
          mkdir -p tools
          RELEASE_INFO=$(curl -sL -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/MorpheApp/morphe-cli/releases/latest")
          JAR_URL=$(echo "$RELEASE_INFO" | grep -o '"browser_download_url": "[^"]*-all.jar"' | head -n 1 | cut -d'"' -f4)
          if [ -z "$JAR_URL" ]; then exit 1; fi
          curl -sL "$JAR_URL" -o tools/morphe-cli.jar

      - name: Download Piko Patches (.mpp)
        id: patches # Captures the patch version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📦 Downloading Piko patches..."
          if [ "${{ matrix.patch_channel }}" = "prerelease" ]; then
            RELEASE_INFO=$(curl -sL -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/crimera/piko/releases" | jq -r '.[0]')
          else
            RELEASE_INFO=$(curl -sL -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/crimera/piko/releases/latest")
          fi
          
          PATCH_URL=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | endswith(".mpp")) | .browser_download_url')
          PATCH_TAG=$(echo "$RELEASE_INFO" | jq -r '.tag_name') # GET PATCH VERSION
          
          if [ -z "$PATCH_URL" ] || [ "$PATCH_URL" = "null" ]; then exit 1; fi
          
          echo "patch_version=$PATCH_TAG" >> $GITHUB_OUTPUT
          echo "Found patch version: $PATCH_TAG"
          curl -sL "$PATCH_URL" -o patches.mpp

      - name: Download APKEditor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p tools
          RELEASE_INFO=$(curl -sL -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/REAndroid/APKEditor/releases/latest")
          JAR_URL=$(echo "$RELEASE_INFO" | grep -o '"browser_download_url": "[^"]*\.jar"' | head -n 1 | cut -d'"' -f4)
          curl -sL "$JAR_URL" -o tools/APKEditor.jar

      - name: Install apkeep
        run: |
          wget -q https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x apkeep-x86_64-unknown-linux-gnu
          sudo mv apkeep-x86_64-unknown-linux-gnu /usr/local/bin/apkeep

      - name: Download Twitter APK & Merge Splits
        id: apk_version_step # Captures the app version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📥 Downloading Twitter APK..."
          mkdir -p download_dir
          
          if [ "${{ matrix.apk_version }}" = "12.2.1" ]; then
            echo "📦 Downloading v12.2.1 using gh CLI..."
            # FIX 2: Use gh CLI to reliably download the .apkm file
            gh release download apk-storage --pattern "*.apkm" --dir download_dir || {
              echo "❌ Could not find .apkm file in the 'apk-storage' release!"
              echo "Please ensure you have a PUBLISHED release tagged exactly 'apk-storage'."
              exit 1
            }
          else
            apkeep -a com.twitter.android -d apk-pure download_dir
          fi
          
          DOWNLOADED_FILE=$(find download_dir -type f \( -name "*.apk" -o -name "*.xapk" -o -name "*.apkm" \) | head -n 1)
          
          if [[ "$DOWNLOADED_FILE" == *.xapk ]] || [[ "$DOWNLOADED_FILE" == *.apkm ]]; then
            echo "📦 Extracting and merging bundle..."
            mkdir -p xapk_extracted
            unzip -q "$DOWNLOADED_FILE" -d xapk_extracted
            java -jar tools/APKEditor.jar m -i xapk_extracted -o base-twitter-merged.apk
            mv base-twitter-merged.apk base-twitter.apk
          else
            mv "$DOWNLOADED_FILE" base-twitter.apk
          fi
          
          # FIX 3: Robustly extract App Version
          VERSION=$(aapt dump badging base-twitter.apk | grep "versionName" | head -n 1 | sed -E "s/.*versionName='([^']+)'.*/\1/")
          echo "apk_version=$VERSION" >> $GITHUB_OUTPUT
          echo "📱 Detected APK version: $VERSION"

      - name: Patch Twitter (Normal Version)
        run: |
          # FIX 4: Use dynamic naming convention (App Version + Patch Version)
          FILENAME="Twitter-Piko-v${{ steps.apk_version_step.outputs.apk_version }}-${{ steps.patches.outputs.patch_version }}-arm64-v8a.apk"
          echo "🔧 Patching Normal version -> $FILENAME"
          java -jar tools/morphe-cli.jar patch \
            -p patches.mpp -f --continue-on-error \
            -d "Bring back twitter" -d "Dynamic color" \
            -o "$FILENAME" base-twitter.apk

      - name: Patch Twitter (Clone Base)
        run: |
          java -jar tools/morphe-cli.jar patch \
            -p patches.mpp -f --continue-on-error \
            -d "Bring back twitter" -d "Dynamic color" \
            -o twitter-patched-clone.apk base-twitter.apk

      - name: Clone and Strip Permissions
        env:
          PATCHED_APK_PATH: twitter-patched-clone.apk
          TRACK: ${{ matrix.variant }}
          APK_VERSION: ${{ steps.apk_version_step.outputs.apk_version }}
          PATCH_VERSION: ${{ steps.patches.outputs.patch_version }} # Pass patch version to python
        run: python scripts/clone_and_strip.py

      - name: Upload Both Versions to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Twitter-Piko-v${{ steps.apk_version_step.outputs.apk_version }}-${{ steps.patches.outputs.patch_version }}-arm64-v8a.apk
            Twitter-Z2-Piko-v${{ steps.apk_version_step.outputs.apk_version }}-${{ steps.patches.outputs.patch_version }}-arm64-v8a.apk
          tag_name: ${{ matrix.variant }}-latest
          name: "Twitter Piko - ${{ matrix.variant }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}            # Get the absolute latest release (including pre-releases)
            RELEASE_INFO=$(curl -sL -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/crimera/piko/releases" | jq -r '.[0]')
          else
            # Get the latest stable release
            RELEASE_INFO=$(curl -sL -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/crimera/piko/releases/latest")
          fi
          
          PATCH_URL=$(echo "$RELEASE_INFO" | grep -o '"browser_download_url": "[^"]*\.mpp"' | head -n 1 | cut -d'"' -f4)
          
          if [ -z "$PATCH_URL" ]; then
            echo "❌ Could not find .mpp patch file!"
            exit 1
          fi
          
          echo "Found patch URL: $PATCH_URL"
          curl -sL "$PATCH_URL" -o patches.mpp
          echo "✅ Patches downloaded successfully!"

      # 3. DOWNLOAD TWITTER APK (using apkeep)
      - name: Install apkeep (Reliable APK Downloader)
        run: |
          wget -q https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x apkeep-x86_64-unknown-linux-gnu
          sudo mv apkeep-x86_64-unknown-linux-gnu /usr/local/bin/apkeep
     
      - name: Download APKEditor (for merging split APKs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📥 Downloading APKEditor..."
          mkdir -p tools
          
          # Use GitHub API with token to find the latest APKEditor release
          RELEASE_INFO=$(curl -sL -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/REAndroid/APKEditor/releases/latest")
          
          # Find the .jar file URL in the release assets
          JAR_URL=$(echo "$RELEASE_INFO" | grep -o '"browser_download_url": "[^"]*\.jar"' | head -n 1 | cut -d'"' -f4)
          
          if [ -z "$JAR_URL" ]; then
            echo "❌ Could not find .jar file in APKEditor latest release!"
            echo "$RELEASE_INFO" | head -20
            exit 1
          fi
          
          echo "Found APKEditor URL: $JAR_URL"
          curl -sL "$JAR_URL" -o tools/APKEditor.jar
          
          if [ ! -s tools/APKEditor.jar ]; then
            echo "❌ Failed to download APKEditor!"
            exit 1
          fi
          
          # Verify it's actually a JAR file and not an HTML error page
          if ! file tools/APKEditor.jar | grep -qi "java archive\|zip archive"; then
            echo "❌ Downloaded file is not a valid JAR!"
            file tools/APKEditor.jar
            exit 1
          fi
          
          echo "✅ APKEditor downloaded successfully!"
          ls -lh tools/APKEditor.jar
          
      - name: Download Twitter APK & Merge Splits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📥 Downloading Twitter APK..."
          mkdir -p download_dir
          
          if [ "${{ matrix.apk_version }}" = "12.2.1" ]; then
            echo "📦 Downloading v12.2.1 from GitHub Release assets..."
            
            # Get the release info and find the .apkm file
            RELEASE_INFO=$(curl -sL -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/apk-storage")
            
            # Search for the specific .apkm file
            ASSET_URL=$(echo "$RELEASE_INFO" | grep -o '"browser_download_url": "[^"]*\.apkm"' | head -n 1 | cut -d'"' -f4)
            
            if [ -z "$ASSET_URL" ]; then
              echo "❌ Could not find .apkm file in the 'apk-storage' release!"
              echo "Release assets found:"
              echo "$RELEASE_INFO" | grep -o '"name": "[^"]*"'
              exit 1
            fi
            
            echo "Found APK URL: $ASSET_URL"
            curl -sL -H "Authorization: token $GITHUB_TOKEN" "$ASSET_URL" -o download_dir/twitter-12.2.1.apkm
            
            if [ ! -s download_dir/twitter-12.2.1.apkm ]; then
              echo "❌ Download failed!"
              exit 1
            fi
            
          else
            echo "Downloading latest version..."
            apkeep -a com.twitter.android -d apk-pure download_dir
          fi
          
          DOWNLOADED_FILE=$(find download_dir -type f \( -name "*.apk" -o -name "*.xapk" -o -name "*.apkm" \) | head -n 1)
          
          if [ -z "$DOWNLOADED_FILE" ] || [ ! -s "$DOWNLOADED_FILE" ]; then
            echo "❌ Download failed or no file found!"
            ls -la download_dir
            exit 1
          fi
          
          echo "✅ Found file: $DOWNLOADED_FILE"
          
          # Handle bundle formats (XAPK, APKM)
          if [[ "$DOWNLOADED_FILE" == *.xapk ]] || [[ "$DOWNLOADED_FILE" == *.apkm ]]; then
            echo "📦 Detected bundle format, extracting..."
            mkdir -p xapk_extracted
            unzip -q "$DOWNLOADED_FILE" -d xapk_extracted
            
            echo "🔀 Merging split APKs into a single full APK..."
            java -jar tools/APKEditor.jar m -i xapk_extracted -o base-twitter-merged.apk
            
            if [ ! -s base-twitter-merged.apk ]; then
              echo "❌ Failed to merge APKs!"
              ls -la xapk_extracted
              exit 1
            fi
            
            mv base-twitter-merged.apk base-twitter.apk
            echo "✅ Merged APK ready for patching!"
          else
            mv "$DOWNLOADED_FILE" base-twitter.apk
          fi
          
          ls -lh base-twitter.apk
          echo "✅ APK ready for patching!"
      - name: Get APK Version
        id: version
        run: |
          VERSION=$(aapt dump badging base-twitter.apk | grep "versionName" | cut -d"'" -f2)
          echo "apk_version=$VERSION" >> $GITHUB_OUTPUT
          echo "📱 Detected APK version: $VERSION"

      # 4. PATCH TWITTER (Normal Version)
      - name: Patch Twitter (Normal Version)
        run: |
          echo "🔧 Patching Twitter (${{ matrix.variant }}) - Normal version..."
          java -jar tools/morphe-cli.jar patch \
            -p patches.mpp \
            -f \
            --continue-on-error \
            -d "Bring back twitter" \
            -d "Dynamic color" \
            -o "Twitter-Piko-${{ steps.version.outputs.apk_version }}-arm64-v8a.apk" \
            base-twitter.apk

      - name: Patch Twitter (Clone Version Base)
        run: |
          echo "🔧 Patching Twitter (${{ matrix.variant }}) - Clone base version..."
          java -jar tools/morphe-cli.jar patch \
            -p patches.mpp \
            -f \
            --continue-on-error \
            -d "Bring back twitter" \
            -d "Dynamic color" \
            -o twitter-patched-clone.apk \
            base-twitter.apk
      # 6. CLONE AND STRIP PERMISSIONS
      - name: Clone and Strip Permissions
        env:
          PATCHED_APK_PATH: twitter-patched-clone.apk
          TRACK: ${{ matrix.variant }}
          APK_VERSION: ${{ steps.version.outputs.apk_version }}
        run: python scripts/clone_and_strip.py

      # 7. UPLOAD TO RELEASE
      - name: Upload Both Versions to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Twitter-Piko-${{ steps.version.outputs.apk_version }}-arm64-v8a.apk
            Twitter-Z2-Piko-${{ steps.version.outputs.apk_version }}-arm64-v8a.apk
          tag_name: ${{ matrix.variant }}-latest
          name: "Twitter Piko - ${{ matrix.variant }}"
          body: |
            ## Twitter Piko ${{ matrix.variant }} Builds
            
            **Build Details:**
            - APK Version: ${{ steps.version.outputs.apk_version }}
            - Patch Channel: ${{ matrix.patch_channel }}
            - Architecture: arm64-v8a only
            
            **Files:**
            1. `Twitter-Piko-${{ steps.version.outputs.apk_version }}-arm64-v8a.apk` - Normal patched version
            2. `Twitter-Z2-Piko-${{ steps.version.outputs.apk_version }}-arm64-v8a.apk` - Z² Clone (com.twitter.androie)
            
            **Excluded Patches:**
            - Bring back twitter
            - Dynamic color
            
            **Z² Clone Features:**
            - Package: com.twitter.androie
            - App Name: Z²
            - Permissions: Stripped to 5 essential only
            
            ---
            *Auto-built on ${{ github.run_id }}*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
