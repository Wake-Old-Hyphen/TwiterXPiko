name: Twitter Z² AutoBuild (6 Variants)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # Daily at 6 AM UTC

env:
  APP_NAME: twitter

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: experimental
            apk_version: latest
            patch_channel: prerelease
          - variant: stable
            apk_version: recommended
            patch_channel: stable
          - variant: xnav
            apk_version: "12.2.1"
            patch_channel: prerelease
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install System Dependencies
        run: |
          pip install requests beautifulsoup4
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Install Android Build Tools
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p $HOME/Android/Sdk/cmdline-tools/latest
          mv cmdline-tools/* $HOME/Android/Sdk/cmdline-tools/latest/
          export PATH=$PATH:$HOME/Android/Sdk/cmdline-tools/latest/bin
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "build-tools;34.0.0" > /dev/null 2>&1
          echo "$HOME/Android/Sdk/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Download ReVanced CLI
        run: |
          echo "📥 Downloading ReVanced CLI..."
          mkdir -p tools
          
          # Use GitHub API to find the latest release and get the correct JAR filename
          RELEASE_INFO=$(curl -sL "https://api.github.com/repos/revanced/revanced-cli/releases/latest")
          
          # Find the JAR file in the release assets (could be revanced-cli.jar, revanced-cli-all.jar, or versioned)
          JAR_URL=$(echo "$RELEASE_INFO" | grep -o '"browser_download_url": "[^"]*\.jar"' | head -n 1 | cut -d'"' -f4)
          
          if [ -z "$JAR_URL" ]; then
            echo "❌ Could not find JAR file in latest release!"
            echo "Release info:"
            echo "$RELEASE_INFO" | head -20
            exit 1
          fi
          
          echo "Found JAR URL: $JAR_URL"
          curl -sL "$JAR_URL" -o tools/revanced-cli.jar
          
          # Verify the file was downloaded and is valid
          if [ ! -s tools/revanced-cli.jar ]; then
            echo "❌ Failed to download revanced-cli.jar or file is empty!"
            ls -lh tools/
            exit 1
          fi
          
          # Check if it's a valid JAR file
          if ! file tools/revanced-cli.jar | grep -q "Java archive\|Zip archive"; then
            echo "❌ Downloaded file is not a valid JAR!"
            file tools/revanced-cli.jar
            head -c 200 tools/revanced-cli.jar
            exit 1
          fi
          
          echo "✅ ReVanced CLI downloaded successfully!"
          ls -lh tools/revanced-cli.jar
      - name: Install apkeep (Reliable APK Downloader)
        run: |
          wget -q https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x apkeep-x86_64-unknown-linux-gnu
          sudo mv apkeep-x86_64-unknown-linux-gnu /usr/local/bin/apkeep

      - name: Download Twitter APK
        run: |
          echo "📥 Downloading Twitter APK..."
          mkdir -p download_dir
          
          if [ "${{ matrix.apk_version }}" = "12.2.1" ]; then
            echo "Attempting to download specific version 12.2.1..."
            apkeep -a com.twitter.android@12.2.1 -d apk-pure download_dir || true
          else
            echo "Downloading latest version..."
            apkeep -a com.twitter.android -d apk-pure download_dir
          fi
          
          # Check what was downloaded
          DOWNLOADED_FILE=$(find download_dir -type f | head -n 1)
          
          if [ -z "$DOWNLOADED_FILE" ] || [ ! -s "$DOWNLOADED_FILE" ]; then
            echo "❌ Download failed or no file found in download_dir!"
            ls -la download_dir
            exit 1
          fi
          
          echo "✅ Found downloaded file: $DOWNLOADED_FILE"
          
          # Handle XAPK files (bundles)
          if [[ "$DOWNLOADED_FILE" == *.xapk ]]; then
            echo "📦 Detected XAPK bundle, extracting..."
            mkdir -p xapk_extracted
            unzip -q "$DOWNLOADED_FILE" -d xapk_extracted
            
            # Find the base APK (not a split APK)
            BASE_APK=$(find xapk_extracted -name "*.apk" -type f | grep -v "split" | head -n 1)
            
            if [ -z "$BASE_APK" ]; then
              BASE_APK=$(find xapk_extracted -name "*.apk" -type f | head -n 1)
            fi
            
            if [ -z "$BASE_APK" ]; then
              echo "❌ No APK found inside XAPK!"
              ls -la xapk_extracted
              exit 1
            fi
            
            echo "✅ Extracted base APK: $BASE_APK"
            mv "$BASE_APK" base-twitter.apk
          else
            # Regular APK file
            mv "$DOWNLOADED_FILE" base-twitter.apk
          fi
          
          ls -lh base-twitter.apk
          echo "✅ APK ready for patching!"

      - name: Get APK Version
        id: version
        run: |
          VERSION=$(aapt dump badging base-twitter.apk | grep "versionName" | cut -d"'" -f2)
          echo "apk_version=$VERSION" >> $GITHUB_OUTPUT
          echo "📱 Detected APK version: $VERSION"

      - name: Download Piko Patches (RVP format)
        run: |
          echo "📦 Downloading Piko patches..."
          
          # Get the latest release from crimera/piko
          RELEASE_INFO=$(curl -sL "https://api.github.com/repos/crimera/piko/releases/latest")
          
          # Find the .rvp patch file URL
          if [ "${{ matrix.patch_channel }}" = "prerelease" ]; then
            # For prerelease, get the latest release (including prereleases)
            RELEASE_INFO=$(curl -sL "https://api.github.com/repos/crimera/piko/releases" | jq -r '.[0]')
          fi
          
          PATCH_URL=$(echo "$RELEASE_INFO" | grep -o '"browser_download_url": "[^"]*\.rvp"' | head -n 1 | cut -d'"' -f4)
          
          if [ -z "$PATCH_URL" ]; then
            echo "❌ Could not find .rvp patch file!"
            echo "Release info:"
            echo "$RELEASE_INFO" | head -30
            exit 1
          fi
          
          echo "Found patch URL: $PATCH_URL"
          curl -sL "$PATCH_URL" -o patches.rvp
          
          if [ ! -s patches.rvp ]; then
            echo "❌ Failed to download patches!"
            exit 1
          fi
          
          echo "✅ Patches downloaded successfully!"
          ls -lh patches.rvp

      - name: Patch Twitter (Normal Version)
        run: |
          echo "🔧 Patching Twitter (${{ matrix.variant }}) - Normal version..."
          java -jar tools/revanced-cli.jar patch \
            base-twitter.apk \
            -p patches.rvp \
            -d "bring-back-twitter" \
            -d "dynamic-color" \
            -o "Twitter-Piko-${{ steps.version.outputs.apk_version }}-arm64-v8a.apk"

      - name: Patch Twitter (Clone Version Base)
        run: |
          echo "🔧 Patching Twitter (${{ matrix.variant }}) - Clone base version..."
          java -jar tools/revanced-cli.jar patch \
            base-twitter.apk \
            -p patches.rvp \
            -d "bring-back-twitter" \
            -d "dynamic-color" \
            -o twitter-patched-clone.apk

      - name: Clone and Strip Permissions
        env:
          PATCHED_APK_PATH: twitter-patched-clone.apk
          TRACK: ${{ matrix.variant }}
          APK_VERSION: ${{ steps.version.outputs.apk_version }}
        run: python scripts/clone_and_strip.py

      - name: Upload Both Versions to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Twitter-Piko-${{ steps.version.outputs.apk_version }}-arm64-v8a.apk
            Twitter-Z2-Piko-${{ steps.version.outputs.apk_version }}-arm64-v8a.apk
          tag_name: ${{ matrix.variant }}-latest
          name: "Twitter Piko - ${{ matrix.variant }}"
          body: |
            ## Twitter Piko ${{ matrix.variant }} Builds
            
            **Build Details:**
            - APK Version: ${{ steps.version.outputs.apk_version }}
            - Patch Channel: ${{ matrix.patch_channel }}
            - Architecture: arm64-v8a only
            
            **Files:**
            1. `Twitter-Piko-${{ steps.version.outputs.apk_version }}-arm64-v8a.apk` - Normal patched version
            2. `Twitter-Z2-Piko-${{ steps.version.outputs.apk_version }}-arm64-v8a.apk` - Z² Clone (com.twitter.androie)
            
            **Excluded Patches:**
            - bring-back-twitter
            - dynamic-color
            
            **Z² Clone Features:**
            - Package: com.twitter.androie
            - App Name: Z²
            - Permissions: Stripped to 5 essential only
            
            ---
            *Auto-built on ${{ github.run_id }}*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
