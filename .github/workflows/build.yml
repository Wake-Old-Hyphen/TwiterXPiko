name: Twitter Z² AutoBuild (6 Variants)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

env:
  APP_NAME: twitter

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: experimental
            apk_version: latest
            patch_channel: prerelease
          - variant: stable
            apk_version: recommended
            patch_channel: stable
          - variant: xnav
            apk_version: "12.2.1"
            patch_channel: prerelease
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install System Dependencies
        run: |
          pip install requests beautifulsoup4
          sudo apt-get update
          sudo apt-get install -y jq
          APKTOOL_VERSION="2.11.1"
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar" -o /usr/local/bin/apktool.jar
          curl -sL "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool" -o /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool

      - name: Install Android Build Tools
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p $HOME/Android/Sdk/cmdline-tools/latest
          mv cmdline-tools/* $HOME/Android/Sdk/cmdline-tools/latest/
          export PATH=$PATH:$HOME/Android/Sdk/cmdline-tools/latest/bin
          yes | sdkmanager --licenses > /dev/null 2>&1
          sdkmanager "build-tools;34.0.0" > /dev/null 2>&1
          echo "$HOME/Android/Sdk/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Download Morphe CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p tools
          RELEASE_INFO=$(curl -sL -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/MorpheApp/morphe-cli/releases/latest")
          JAR_URL=$(echo "$RELEASE_INFO" | grep -o '"browser_download_url": "[^"]*-all.jar"' | head -n 1 | cut -d'"' -f4)
          curl -sL "$JAR_URL" -o tools/morphe-cli.jar

      - name: Download Piko Patches (.mpp)
        id: patches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.patch_channel }}" = "prerelease" ]; then
            RELEASE_INFO=$(curl -sL -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/crimera/piko/releases" | jq -r '.[0]')
          else
            RELEASE_INFO=$(curl -sL -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/crimera/piko/releases/latest")
          fi
          PATCH_URL=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | endswith(".mpp")) | .browser_download_url')
          PATCH_TAG=$(echo "$RELEASE_INFO" | jq -r '.tag_name')
          echo "patch_version=$PATCH_TAG" >> $GITHUB_OUTPUT
          curl -sL "$PATCH_URL" -o patches.mpp

      - name: Download APKEditor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p tools
          RELEASE_INFO=$(curl -sL -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/REAndroid/APKEditor/releases/latest")
          JAR_URL=$(echo "$RELEASE_INFO" | grep -o '"browser_download_url": "[^"]*\.jar"' | head -n 1 | cut -d'"' -f4)
          curl -sL "$JAR_URL" -o tools/APKEditor.jar

      - name: Install apkeep
        run: |
          wget -q https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x apkeep-x86_64-unknown-linux-gnu
          sudo mv apkeep-x86_64-unknown-linux-gnu /usr/local/bin/apkeep

      - name: Download Twitter APK & Merge Splits
        id: apk_version_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p download_dir
          if [ "${{ matrix.apk_version }}" = "12.2.1" ]; then
            gh release download v12.2.1-storage --pattern "*.apkm" --dir download_dir
          else
            apkeep -a com.twitter.android -d apk-pure download_dir
          fi
          DOWNLOADED_FILE=$(find download_dir -type f \( -name "*.apk" -o -name "*.xapk" -o -name "*.apkm" \) | head -n 1)
          if [[ "$DOWNLOADED_FILE" == *.xapk ]] || [[ "$DOWNLOADED_FILE" == *.apkm ]]; then
            mkdir -p xapk_extracted
            unzip -q "$DOWNLOADED_FILE" -d xapk_extracted
            java -jar tools/APKEditor.jar m -i xapk_extracted -o base-twitter-merged.apk
            mv base-twitter-merged.apk base-twitter.apk
          else
            mv "$DOWNLOADED_FILE" base-twitter.apk
          fi
          VERSION=$(aapt dump badging base-twitter.apk | grep "versionName" | head -n 1 | sed -E "s/.*versionName='([^']+)'.*/\1/")
          echo "apk_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Apply x-shim PairIP Bypass (XNAV Only)
        if: matrix.apk_version == '12.2.1'
        run: |
          echo "🛡️ Applying x-shim for PairIP bypass..."
          XSHIM_URL=$(curl -sL "https://gitlab.com/api/v4/projects/inotia00%2Fx-shim/releases" | jq -r '[.[] | .assets.links[] | select(.name | endswith(".mpp")) | .direct_asset_url // .url][0]')
          curl -sL "$XSHIM_URL" -o x-shim.mpp
          java -jar tools/morphe-cli.jar patch -p x-shim.mpp -f --continue-on-error -o base-twitter-xshim.apk base-twitter.apk
          mv base-twitter-xshim.apk base-twitter.apk
          echo "✅ x-shim applied!"

      - name: Patch Twitter (Normal Version)
        run: |
          FILENAME="Twitter-Piko-v${{ steps.apk_version_step.outputs.apk_version }}-${{ steps.patches.outputs.patch_version }}-arm64-v8a.apk"
          java -jar tools/morphe-cli.jar patch -p patches.mpp -f --continue-on-error -d "Bring back twitter" -d "Dynamic color" -o "$FILENAME" base-twitter.apk

      - name: Patch Twitter (Clone Base)
        run: |
          java -jar tools/morphe-cli.jar patch -p patches.mpp -f --continue-on-error -d "Bring back twitter" -d "Dynamic color" -o twitter-patched-clone.apk base-twitter.apk

      - name: Clone and Strip Permissions
        env:
          PATCHED_APK_PATH: twitter-patched-clone.apk
          TRACK: ${{ matrix.variant }}
          APK_VERSION: ${{ steps.apk_version_step.outputs.apk_version }}
          PATCH_VERSION: ${{ steps.patches.outputs.patch_version }}
        run: |
          cat << 'PYTHON_SCRIPT' > scripts/clone_and_strip.py
import xml.etree.ElementTree as ET
import os
import subprocess
import sys

NEW_PACKAGE_NAME = "com.twitter.androie"
NEW_APP_NAME = "Z²"
ALLOWED_PERMISSIONS = ["android.permission.FOREGROUND_SERVICE", "android.permission.FOREGROUND_SERVICE_DATA_SYNC", "android.permission.INTERNET", "android.permission.ACCESS_NETWORK_STATE", "android.permission.ACCESS_WIFI_STATE"]

def main():
    apk_file = os.environ.get("PATCHED_APK_PATH", "twitter-patched-clone.apk")
    if not os.path.exists(apk_file):
        sys.exit(1)

    decoded_dir = "twitter_decoded"
    subprocess.run(["apktool", "d", apk_file, "-o", decoded_dir, "-f", "--use-aapt2"], check=True)

    manifest_path = os.path.join(decoded_dir, "AndroidManifest.xml")
    tree = ET.parse(manifest_path)
    root = tree.getroot()

    root.set("package", NEW_PACKAGE_NAME)
    root.set("{http://schemas.android.com/apk/res/android}sharedUserId", NEW_PACKAGE_NAME + ".shared")

    app = root.find("application")
    if app is not None:
        app.set("{http://schemas.android.com/apk/res/android}label", NEW_APP_NAME)

    for perm_type in ["uses-permission", "uses-permission-sdk-23"]:
        for perm in list(root.findall(perm_type)):
            perm_name = perm.get("{http://schemas.android.com/apk/res/android}name")
            if perm_name and perm_name not in ALLOWED_PERMISSIONS:
                root.remove(perm)

    tree.write(manifest_path, encoding="utf-8", xml_declaration=True)

    strings_path = os.path.join(decoded_dir, "res", "values", "strings.xml")
    if os.path.exists(strings_path):
        str_tree = ET.parse(strings_path)
        str_root = str_tree.getroot()
        for string in str_root.findall("string"):
            if string.get("name") in ["app_name", "title", "name"]:
                string.text = NEW_APP_NAME
        str_tree.write(strings_path, encoding="utf-8", xml_declaration=True)

    cloned_apk = "twitter-z2-cloned-unsigned.apk"
    subprocess.run(["apktool", "b", decoded_dir, "-o", cloned_apk, "--use-aapt2"], check=True)

    apk_version = os.environ.get("APK_VERSION", "unknown")
    patch_version = os.environ.get("PATCH_VERSION", "unknown")
    final_apk = "Twitter-Z2-Piko-v" + apk_version + "-" + patch_version + "-arm64-v8a.apk"
    
    keystore = "debug.keystore"
    if not os.path.exists(keystore):
        subprocess.run(["keytool", "-genkey", "-v", "-keystore", keystore, "-alias", "z2debug", "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000", "-storepass", "android", "-keypass", "android", "-dname", "CN=Z2"], check=True)

    subprocess.run(["apksigner", "sign", "--ks", keystore, "--ks-pass", "pass:android", "--out", final_apk, cloned_apk], check=True)
    subprocess.run(["rm", "-rf", decoded_dir, cloned_apk])

if __name__ == "__main__":
    main()
PYTHON_SCRIPT
          python scripts/clone_and_strip.py

      - name: Upload Both Versions to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Twitter-Piko-v${{ steps.apk_version_step.outputs.apk_version }}-${{ steps.patches.outputs.patch_version }}-arm64-v8a.apk
            Twitter-Z2-Piko-v${{ steps.apk_version_step.outputs.apk_version }}-${{ steps.patches.outputs.patch_version }}-arm64-v8a.apk
          tag_name: ${{ matrix.variant }}-latest
          name: "Twitter Piko - ${{ matrix.variant }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install apkeep
        run: |
          wget -q https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x apkeep-x86_64-unknown-linux-gnu
          sudo mv apkeep-x86_64-unknown-linux-gnu /usr/local/bin/apkeep

      - name: Download Twitter APK & Merge Splits
        id: apk_version_step # Captures the app version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📥 Downloading Twitter APK..."
          mkdir -p download_dir
          
          if [ "${{ matrix.apk_version }}" = "12.2.1" ]; then
            echo "📦 Downloading v12.2.1 using gh CLI..."
            # FIXED: Use the correct tag name 'v12.2.1-storage'
            gh release download v12.2.1-storage --pattern "*.apkm" --dir download_dir || {
              echo "❌ Could not find .apkm file in the 'v12.2.1-storage' release!"
              echo "Please ensure you have a PUBLISHED release tagged exactly 'v12.2.1-storage'."
              exit 1
            }
          else
            apkeep -a com.twitter.android -d apk-pure download_dir
          fi
          
          DOWNLOADED_FILE=$(find download_dir -type f \( -name "*.apk" -o -name "*.xapk" -o -name "*.apkm" \) | head -n 1)
          
          if [[ "$DOWNLOADED_FILE" == *.xapk ]] || [[ "$DOWNLOADED_FILE" == *.apkm ]]; then
            echo "📦 Extracting and merging bundle..."
            mkdir -p xapk_extracted
            unzip -q "$DOWNLOADED_FILE" -d xapk_extracted
            java -jar tools/APKEditor.jar m -i xapk_extracted -o base-twitter-merged.apk
            mv base-twitter-merged.apk base-twitter.apk
          else
            mv "$DOWNLOADED_FILE" base-twitter.apk
          fi
          
          # FIX 3: Robustly extract App Version
          VERSION=$(aapt dump badging base-twitter.apk | grep "versionName" | head -n 1 | sed -E "s/.*versionName='([^']+)'.*/\1/")
          echo "apk_version=$VERSION" >> $GITHUB_OUTPUT
          echo "📱 Detected APK version: $VERSION"
      - name: Apply x-shim PairIP Bypass (XNAV Only)
        if: matrix.apk_version == '12.2.1'
        run: |
          echo "🛡️ Applying x-shim for PairIP bypass..."
          
          # Download ReVanced CLI v3.1.1 (best for .jar bundles)
          curl -sL "https://github.com/ReVanced/revanced-cli/releases/download/v3.1.1/revanced-cli-3.1.1-all.jar" -o revanced-cli.jar
          
          # Download x-shim directly from GitLab releases API
          XSHIM_URL=$(curl -sL "https://gitlab.com/api/v4/projects/inotia00%2Fx-shim/releases" | jq -r '.[0].assets.links[] | select(.name | endswith(".jar")) | .url' | head -n 1)
          
          if [ -z "$XSHIM_URL" ] || [ "$XSHIM_URL" = "null" ]; then
             echo "❌ Could not find x-shim .jar on GitLab"
             exit 1
          fi
          
          echo "Downloading x-shim from: $XSHIM_URL"
          curl -sL "$XSHIM_URL" -o x-shim.jar
          
          # Patch with x-shim
          echo "Patching base-twitter.apk with x-shim..."
          java -jar revanced-cli.jar -a base-twitter.apk -b x-shim.jar -o base-twitter-xshim.apk
          
          # Overwrite base APK with the x-shim patched version
          mv base-twitter-xshim.apk base-twitter.apk
          echo "✅ x-shim applied! Proceeding to Piko patches."    

      - name: Patch Twitter (Normal Version)
        run: |
          # FIX 4: Use dynamic naming convention (App Version + Patch Version)
          FILENAME="Twitter-Piko-v${{ steps.apk_version_step.outputs.apk_version }}-${{ steps.patches.outputs.patch_version }}-arm64-v8a.apk"
          echo "🔧 Patching Normal version -> $FILENAME"
          java -jar tools/morphe-cli.jar patch \
            -p patches.mpp -f --continue-on-error \
            -d "Bring back twitter" -d "Dynamic color" \
            -o "$FILENAME" base-twitter.apk

      - name: Patch Twitter (Clone Base)
        run: |
          java -jar tools/morphe-cli.jar patch \
            -p patches.mpp -f --continue-on-error \
            -d "Bring back twitter" -d "Dynamic color" \
            -o twitter-patched-clone.apk base-twitter.apk

      - name: Clone and Strip Permissions
        env:
          PATCHED_APK_PATH: twitter-patched-clone.apk
          TRACK: ${{ matrix.variant }}
          APK_VERSION: ${{ steps.apk_version_step.outputs.apk_version }}
          PATCH_VERSION: ${{ steps.patches.outputs.patch_version }} # Pass patch version to python
        run: python scripts/clone_and_strip.py

      - name: Upload Both Versions to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Twitter-Piko-v${{ steps.apk_version_step.outputs.apk_version }}-${{ steps.patches.outputs.patch_version }}-arm64-v8a.apk
            Twitter-Z2-Piko-v${{ steps.apk_version_step.outputs.apk_version }}-${{ steps.patches.outputs.patch_version }}-arm64-v8a.apk
          tag_name: ${{ matrix.variant }}-latest
          name: "Twitter Piko - ${{ matrix.variant }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
